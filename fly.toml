# Fly.io configuration. bin/fly-setup fills in the app name and region for you.
# Docs: https://fly.io/docs/reference/configuration/

app = "CHANGE-ME"
primary_region = "iad"
console_command = "/rails/bin/rails console"
swap_size_mb = 512   # extra headroom for resizing large photos

[build]

[env]
  # Run background jobs (sign-in emails, built-in AI photo analysis) inside the web server
  SOLID_QUEUE_IN_PUMA = "1"
  RAILS_LOG_LEVEL = "info"
  # The public URL defaults to https://<app>.fly.dev. With a custom domain, set it:
  # APP_ORIGIN = "https://tools.example.com"

# SQLite databases and uploaded photos live on this volume, so they survive deploys.
# SQLite needs a single machine: keep the app at one machine (no `fly scale count 2`).
[mounts]
  source = "toolbrary_data"
  destination = "/rails/storage"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"   # sleeps when idle, so you only pay while it's used
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/up"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
